version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vericheck-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - JWT_SECRET=super-secret-plagiarism-key-99
    volumes:
      - ./data.csv:/app/data.csv
      - ./backend/app/ml:/app/backend/app/ml
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: vericheck-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped